services:
  api:
    build:
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu124}
        TORCH_PACKAGE: ${TORCH_PACKAGE:-torch==2.11.0+cu124}
    gpus: all
    environment:
      OPENAI_BASE_URL: http://vllm:8000/v1
      OPENAI_API_KEY: ${VLLM_API_KEY:-change-me-vllm-key}
      OPENAI_CHAT_MODEL: ${VLLM_SERVED_MODEL_NAME:-qwen-vl-demo}
      OPENAI_VISION_MODEL: ${VLLM_SERVED_MODEL_NAME:-qwen-vl-demo}
      LOCAL_DEVICE: ${LOCAL_DEVICE:-cuda}
    depends_on:
      vllm:
        condition: service_started

  worker:
    build:
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu124}
        TORCH_PACKAGE: ${TORCH_PACKAGE:-torch==2.11.0+cu124}
    gpus: all
    environment:
      OPENAI_BASE_URL: http://vllm:8000/v1
      OPENAI_API_KEY: ${VLLM_API_KEY:-change-me-vllm-key}
      OPENAI_CHAT_MODEL: ${VLLM_SERVED_MODEL_NAME:-qwen-vl-demo}
      OPENAI_VISION_MODEL: ${VLLM_SERVED_MODEL_NAME:-qwen-vl-demo}
      LOCAL_DEVICE: ${LOCAL_DEVICE:-cuda}
    depends_on:
      vllm:
        condition: service_started

  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    ipc: host
    shm_size: "16gb"
    gpus: all
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
    ports:
      - "${VLLM_PORT:-8008}:8000"
    volumes:
      - ${HF_CACHE_DIR:-./models/huggingface}:/root/.cache/huggingface
    command:
      - --model
      - ${VLLM_MODEL:-Qwen/Qwen2.5-VL-7B-Instruct}
      - --served-model-name
      - ${VLLM_SERVED_MODEL_NAME:-qwen-vl-demo}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --api-key
      - ${VLLM_API_KEY:-change-me-vllm-key}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-16384}
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.88}
