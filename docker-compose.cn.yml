services:
  postgres:
    image: m.daocloud.io/docker.io/pgvector/pgvector:pg16

  redis:
    image: m.daocloud.io/docker.io/library/redis:7-alpine

  minio:
    image: m.daocloud.io/docker.io/minio/minio:latest

  api:
    build:
      args:
        PYTHON_IMAGE: m.daocloud.io/docker.io/library/python:3.12-slim

  worker:
    build:
      args:
        PYTHON_IMAGE: m.daocloud.io/docker.io/library/python:3.12-slim

  web:
    build:
      args:
        NODE_IMAGE: m.daocloud.io/docker.io/library/node:22-alpine
